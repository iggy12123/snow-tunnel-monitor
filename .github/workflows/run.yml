name: Auto Update
on:
  schedule:
    - cron: '*/30 * * * *'  # 每 30 分鐘更新一次
  workflow_dispatch:        # 保留手動按鈕
  workflow_dispatch: # 保留手動更新按鈕
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        run: python main.py
      - name: Update page
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          git commit -m "自動更新路況" || exit 0
          git push
